name: Site checks

# لا ينشر هذا السير العمل الموقع ولا يدمج شيئًا؛ يفحص الملفات والوصولية فقط.

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: فحص الملفات و JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: فحص بناء JavaScript
        run: |
          node --check js/config.js
          node --check js/cart.js

      - name: الفحص الآلي للموقع
        run: node scripts/check-site.mjs

      - name: اختبار مراقب إعدادات الطلب
        run: node --test scripts/order-config-monitor.test.mjs

      - name: اختبار محرك الطلبات قيد التطوير
        run: node --test order-system/*.test.mjs

      - name: اختبار قاعدة الطلبات المؤقتة
        run: |
          npm install --prefix "$RUNNER_TEMP/rawaa-pgtest" --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.3.14
          export PGLITE_MODULE="$RUNNER_TEMP/rawaa-pgtest/node_modules/@electric-sql/pglite/dist/index.js"
          node order-system/schema-pg-test.mjs
          node order-system/repository-pg-test.mjs
          node order-system/outbox-pg-test.mjs
          node order-system/pagination-pg-test.mjs
          node order-system/edge-owner-pg-test.mjs
          node order-system/order-http-pg-test.mjs
          node order-system/telegram-pairing-pg-test.mjs
          node order-system/edge-pairing-pg-test.mjs

      - name: عرض الأدوات المستخدمة (بلا نشر)
        run: echo "لا توجد خطوة نشر في هذا السير العمل."

  dependency-security:
    name: تدقيق أمان التبعيات المقفلة
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          check-latest: true
      # نفحص أدوات التطوير أيضًا، ونُفشل الفحص عند الثغرات العالية أو الحرجة.
      - name: فحص التنبيهات الأمنية
        run: npm audit --audit-level=high

  accessibility:
    name: تدقيق الإتاحة (axe-core · WCAG 2.1 AA)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          check-latest: true

      - name: تثبيت Playwright و axe-core
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
          npm ci --ignore-scripts --no-audit --no-fund
          test -f node_modules/axe-core/axe.min.js && echo "axe-core جاهز: $(pwd)/node_modules/axe-core/axe.min.js"

      - name: تشغيل خادم محلي
        run: |
          python -m http.server 8080 --bind 127.0.0.1 &
          sleep 2
          curl -sf -o /dev/null http://127.0.0.1:8080/index.html

      - name: تدقيق الإتاحة وقياس الوزن
        env:
          AXE_PATH: ${{ github.workspace }}/node_modules/axe-core/axe.min.js
        run: python scripts/a11y-audit.py --base http://127.0.0.1:8080

      - name: رفع تقرير الإتاحة
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: a11y-report
          path: docs/a11y-report.json
          if-no-files-found: warn

  browser:
    name: اختبار المتصفح الوظيفي
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: تثبيت Playwright
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium webkit

      - name: تشغيل خادم محلي
        run: |
          python -m http.server 8080 --bind 127.0.0.1 &
          sleep 2
          curl -sf -o /dev/null http://127.0.0.1:8080/index.html

      - name: اختبار السلة وواتساب والتجاوب
        run: python scripts/browser-test.py --base http://127.0.0.1:8080

      # WebKit يطبّق upgrade-insecure-requests، لذا يجب اختبار سياسة الموقع
      # الأصلية عبر HTTPS محلي بدل إزالة السياسة أو اعتبار فشل TLS عيبًا بالموقع.
      - name: تشغيل HTTPS محلي لاختبار WebKit
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -keyout "$RUNNER_TEMP/test-key.pem" -out "$RUNNER_TEMP/test-cert.pem" -days 1 -subj '/CN=localhost' >/dev/null 2>&1
          python scripts/test-https-server.py "$RUNNER_TEMP/test-cert.pem" "$RUNNER_TEMP/test-key.pem" &
          sleep 2
          curl -ksf -o /dev/null https://127.0.0.1:8443/serum.html

      - name: اختبار صفحة السيروم بمحرك WebKit المشابه لسفاري
        run: python scripts/serum-browser-test.py --base https://127.0.0.1:8443 --path /serum.html --browser webkit --ignore-https-errors

      - name: اختبار صفحة السيروم ومسار الإعلان
        run: python scripts/serum-browser-test.py --base http://127.0.0.1:8080 --path /serum.html
