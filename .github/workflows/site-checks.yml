name: Site checks

# لا ينشر هذا السير العمل الموقع ولا يدمج شيئًا؛ يفحص الملفات والوصولية فقط.

on:
  # PR branches are validated by pull_request below; limiting push here to main
  # avoids running the full browser/database matrix twice for every PR commit.
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: فحص الملفات و JavaScript
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm

      - name: تثبيت parser YAML من الإصدارات المقفلة
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: حارس اعتماديات فحص الموقع
        run: node --test scripts/workflow-dependency-policy.test.mjs

      - name: فحص بناء JavaScript
        run: |
          node --check js/config.js
          node --check js/cart.js
          node --check js/campaign.js
          node --check js/pwa-install.js

      - name: تدقيق المراجع والأصول
        run: node scripts/ref-audit.mjs

      - name: ميزانية الوزن الثابتة
        run: node scripts/perf-static.mjs

      - name: الفحص الآلي للموقع
        run: node scripts/check-site.mjs

      # العطل الذي أوجب هذه الخطوة (7 نوفمبر 2026): بُنيت الصفحات بملفات CSS/JS
      # مستخرجة، وبقيت قائمة ذاكرة عامل الخدمة على حالها. فحص المصدر يكشف
      # الانحراف، لكن فحص **المخرَج** وحده يثبت أن الملفات تُنشر فعلًا: بناء
      # الموقع ينسخ قائمة مسارات محددة، فملف يعمل محليًا قد لا يُنسخ أصلًا.
      - name: تغطية ذاكرة العمل على نسخة البناء
        run: |
          bash scripts/build-deploy.sh
          node scripts/sw-build-coverage.mjs

      - name: اختبار مراقب إعدادات الطلب
        run: node --test scripts/order-config-monitor.test.mjs

      # هذا الحارس كان غائبًا، فمرّ عطل حقيقي: البناء ينشر config.js كـJSON
      # والمراقب يقرأه بتعبيرات نمطية للمصدر، ففشلت المراقبة الحيّة ١١ مرة
      # متتالية بإنذار كاذب. الاختبار هنا يشغّل البناء الفعلي ويقرأ مخرَجه.
      - name: عقد الإعدادات المنشورة (مخرَج البناء يُقرَأ بالمراقب نفسه)
        run: node --test scripts/published-config-contract.test.mjs

      # محرّر المالك: المنطق + الواجهة في DOM حقيقي. أي عرض يُقبله المحرّر
      # ويُسقطه المتجر بصمت يعني أن المالك نشر عرضًا لا يعمل.
      - name: محرّر الأسعار والعروض للمالك
        run: node --test scripts/pricing-editor.test.mjs scripts/pricing-tool-dom.test.mjs scripts/pricing-policy-single-source.test.mjs scripts/shipping-cost.test.mjs scripts/csp-no-inline.test.mjs scripts/policy-copy-consistency.test.mjs scripts/page-scripts-wiring.test.mjs scripts/axe-csp-honesty.test.mjs

      - name: اختبار تجميع ميزانية Lighthouse المتسامح مع الضجيج
        run: node --test scripts/perf-budget.test.mjs

      - name: اختبار عدّة التشغيل (رسائل ما بعد الطلب والأسعار)
        run: node --test scripts/ops-kit.test.mjs

      # إعادة البناء كانت تسبق الاختبارات فتُصلح الحزمة التالفة بصمت وينجح الفحص.
      # الآن يجب أن تطابق الحزمة الملتزَمة ناتج البناء حرفيًا، وأن تكون صياغتها سليمة.
      - name: حزمة استقبال الطلبات مطابقة للمصادر (منع الانحراف)
        run: |
          node scripts/build-order-entry.mjs
          node --check order-system/edge/order-entry-bundle.mjs
          if ! git diff --exit-code -- order-system/edge/order-entry-bundle.mjs; then
            echo "::error::الحزمة الملتزَمة لا تطابق المصادر. شغّل: npm run build:order ثم أضف الناتج إلى الالتزام."
            exit 1
          fi

      # نفس الانحراف كان موجودًا في outbox وtelegram-test بلا أي حارس.
      - name: كل حزم Edge مطابقة لمصادرها (منع الانحراف)
        run: npm run check:edge

      - name: اختبار محرك الطلبات قيد التطوير
        run: node --test order-system/*.test.mjs

      - name: اختبار مُشغّل التنبيهات يقرأ فشل التسليم
        run: node --test scripts/outbox-scheduler-workflow.test.mjs

      - name: اختبار قاعدة الطلبات المؤقتة
        run: |
          npm install --prefix "$RUNNER_TEMP/rawaa-pgtest" --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.3.14
          export PGLITE_MODULE="$RUNNER_TEMP/rawaa-pgtest/node_modules/@electric-sql/pglite/dist/index.js"
          # Each file owns an ephemeral database; limit workers to cap memory.
          # Node reports failure if any file fails, and discovers new integration files.
          node --test --test-concurrency=3 order-system/*-pg-test.mjs

      - name: عرض الأدوات المستخدمة (بلا نشر)
        run: echo "لا توجد خطوة نشر في هذا السير العمل."

  dependency-security:
    name: تدقيق أمان التبعيات المقفلة
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          check-latest: true
      # يمنع عودة ثغرات التطوير المتوسطة التي لا يفشل عندها حد npm audit الافتراضي هنا.
      - name: التحقق من إصدارات glob وminimatch المصححة
        run: node scripts/check-dependency-security-lock.mjs
      # نفحص أدوات التطوير أيضًا، ونُفشل الفحص عند الثغرات العالية أو الحرجة.
      - name: فحص التنبيهات الأمنية
        run: npm audit --audit-level=high

  accessibility:
    name: تدقيق الإتاحة (axe-core · WCAG 2.1 AA)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          check-latest: true

      - name: تثبيت Playwright و axe-core
        run: |
          python -m pip install --quiet "playwright==1.64.1"
          python -m playwright install --with-deps chromium
          npm ci --ignore-scripts --no-audit --no-fund
          test -f node_modules/axe-core/axe.min.js && echo "axe-core جاهز: $(pwd)/node_modules/axe-core/axe.min.js"

      - name: تشغيل خادم محلي
        run: |
          python -m http.server 8080 --bind 127.0.0.1 &
          sleep 2
          curl -sf -o /dev/null http://127.0.0.1:8080/index.html

      - name: تدقيق الإتاحة وقياس الوزن
        env:
          AXE_PATH: ${{ github.workspace }}/node_modules/axe-core/axe.min.js
        run: |
          python scripts/a11y-audit.py --base http://127.0.0.1:8080
          python scripts/axe-audit.py --base http://127.0.0.1:8080 --fail-on serious

      - name: رفع تقرير الإتاحة
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: a11y-report
          path: docs/a11y-report.json
          if-no-files-found: warn

  browser-chromium:
    name: اختبار Chromium والسلة
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: تثبيت Playwright و Chromium
        run: |
          python -m pip install --quiet "playwright==1.64.1"
          python -m playwright install --with-deps chromium
      - name: تشغيل محاكي Cloudflare Pages للمسارات النظيفة
        run: |
          python scripts/pwa-redirect-server.py --port 8080 &
          sleep 2
          curl -sfL -o /dev/null http://127.0.0.1:8080/index.html
      - name: اختبار السلة وواتساب والتجاوب
        run: python scripts/browser-test.py --base http://127.0.0.1:8080
      - name: اختبار صفحة السيروم ومسار الإعلان
        run: python scripts/serum-browser-test.py --base http://127.0.0.1:8080 --path /serum.html
      - name: اختبار صفحة الهبوط للحملات
        run: python scripts/campaign-browser-test.py --base http://127.0.0.1:8080 --browser chromium

  browser-webkit:
    name: اختبار WebKit على HTTPS
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: تثبيت Playwright و WebKit
        run: |
          # لا تُخفِّض هذا الإصدار: محرك WebKit أقدم يفشل اختبار التنقّل دون اتصال
          # عبر عامل الخدمة. 1.64.1 هو الإصدار الذي كانت CI تمرّ به قبل التثبيت.
          python -m pip install --quiet "playwright==1.64.1"
          python -m playwright install --with-deps webkit
      # Preserve the real CSP and test over HTTPS instead of disabling it.
      - name: تشغيل HTTPS محلي لاختبار WebKit
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -keyout "$RUNNER_TEMP/test-key.pem" -out "$RUNNER_TEMP/test-cert.pem" -days 1 -subj '/CN=localhost' >/dev/null 2>&1
          python scripts/test-https-server.py "$RUNNER_TEMP/test-cert.pem" "$RUNNER_TEMP/test-key.pem" &
          sleep 2
          curl -ksf -o /dev/null https://127.0.0.1:8443/serum.html
      - name: اختبار صفحة السيروم بمحرك WebKit المشابه لسفاري
        run: python scripts/serum-browser-test.py --base https://127.0.0.1:8443 --path /serum.html --browser webkit --ignore-https-errors
      - name: اختبار صفحة الهبوط للحملات في WebKit
        run: python scripts/campaign-browser-test.py --base https://127.0.0.1:8443 --browser webkit --ignore-https-errors

  # Keep the original check name: neither a failure nor a skipped child is success.
  browser:
    name: اختبار المتصفح الوظيفي
    if: always()
    needs: [browser-chromium, browser-webkit]
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: التأكد من نجاح مساري المتصفح
        env:
          CHROMIUM_RESULT: ${{ needs.browser-chromium.result }}
          WEBKIT_RESULT: ${{ needs.browser-webkit.result }}
        run: test "$CHROMIUM_RESULT" = success && test "$WEBKIT_RESULT" = success
