name: Customer-data retention (staging)

# Owner-approved on 2026-11-06: daily cleanup is now scheduled. Merging this file
# still cannot start cleanup by itself — both repository variables must be 'true'
# and the scheduler secret must exist, so the owner keeps an immediate kill switch.
# The endpoint calls bounded cleanup for orders and marketing events; it reveals
# no row counts.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      confirm_reviewed_run:
        description: 'Run only after approved migration, endpoint, and isolated staging verification'
        type: choice
        required: true
        default: 'disabled'
        options:
          - disabled
          - run_after_review

permissions:
  contents: read

concurrency:
  group: retention-scheduler
  cancel-in-progress: false

jobs:
  redact-expired-contacts:
    name: تنظيف بيانات التواصل المنتهية
    # المفتاحان يبقيان شرطًا في كل تشغيل، مجدولًا كان أو يدويًا: إسقاط أي منهما
    # إلى غير 'true' يوقف التنظيف فورًا بلا تعديل كود. التشغيل اليدوي ما زال
    # يحتاج اختيار التأكيد صراحةً، وقيمته الافتراضية 'disabled'.
    if: ${{ vars.RAWAA_RETENTION_ENABLED == 'true' && vars.RAWAA_RETENTION_REVIEWED == 'true' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.confirm_reviewed_run == 'run_after_review')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: استدعاء مهمة الاحتفاظ المرحلية
        env:
          RAWAA_RETENTION_SCHEDULER_SECRET: ${{ secrets.RAWAA_RETENTION_SCHEDULER_SECRET }}
          RETENTION_URL: https://oyoyozdugicmnkfhjovo.supabase.co/functions/v1/rawaa-retention
        run: |
          if [ -z "$RAWAA_RETENTION_SCHEDULER_SECRET" ]; then
            # مع الجدولة اليومية كان التخطّي الصامت سيُنتج «نجاحًا» كل يوم بلا عمل.
            # notice يجعل سبب عدم التشغيل مقروءًا من واجهة GitHub لا من السجل فقط.
            echo "::notice::لم تُشغَّل مهمة الاحتفاظ: السرّ RAWAA_RETENTION_SCHEDULER_SECRET غير مضبوط في أسرار GitHub."
            exit 0
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $RAWAA_RETENTION_SCHEDULER_SECRET" \
            --max-time 40 "$RETENTION_URL" || echo 000)
          echo "Retention endpoint HTTP $code"
          if [ "$code" != "200" ]; then
            echo "فشلت مهمة الاحتفاظ؛ لا تُعرض تفاصيل قاعدة البيانات في السجل."
            exit 1
          fi
