name: PR preview — Cloudflare Pages

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pages-preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: Build and publish isolated PR preview
    # Never expose Cloudflare credentials to fork-originated pull requests.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout PR merge result
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          check-latest: true
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate site and content
        run: node scripts/check-site.mjs

      - name: Build Pages output
        run: bash scripts/build-deploy.sh

      - name: Verify preview payload
        run: |
          test -s dist/site/index.html
          test -s dist/site/luxury.html
          test -s dist/site/assets/brand/logo-primary-v2.svg
          test -s dist/site/assets/img/products/editorial-v5-720.jpg
          fonts=$(find dist/site/assets/fonts -maxdepth 1 -name '*.woff2' -type f 2>/dev/null | wc -l)
          echo "Fonts in preview package: $fonts"
          test "$fonts" -ge 5

      - name: Deploy isolated Cloudflare Pages preview
        id: deploy
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/site --project-name=raawaa-store --branch=pr-${{ github.event.pull_request.number }} --commit-hash=${{ github.event.pull_request.head.sha }} --commit-message="Preview PR #${{ github.event.pull_request.number }}"

      - name: Verify deployed preview and noindex
        env:
          PREVIEW_URL: https://pr-${{ github.event.pull_request.number }}.raawaa-store.pages.dev
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if curl -fsSL --max-time 25 "$PREVIEW_URL/luxury.html" -o /tmp/luxury.html; then
              break
            fi
            echo "Waiting for preview propagation ($attempt/6)"
            sleep 10
          done
          grep -q 'RAWAA | رواء' /tmp/luxury.html
          curl -fsSI --max-time 25 "$PREVIEW_URL/luxury.html" | tr -d '\r' | grep -qi '^x-robots-tag:.*noindex'
          curl -fsSI --max-time 25 "$PREVIEW_URL/assets/brand/logo-primary-v2.svg" >/dev/null
          curl -fsSI --max-time 25 "$PREVIEW_URL/assets/img/products/editorial-v5-720.jpg" >/dev/null
          echo "Verified preview: $PREVIEW_URL/luxury.html"
          {
            echo "## Cloudflare Pages preview"
            echo ""
            echo "- URL: $PREVIEW_URL/luxury.html"
            echo "- PR branch alias: `pr-${{ github.event.pull_request.number }}`"
            echo "- Search indexing: blocked (X-Robots-Tag: noindex)"
            echo "- Production site: untouched"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish or update PR preview comment
        uses: actions/github-script@v8
        env:
          PREVIEW_URL: https://pr-${{ github.event.pull_request.number }}.raawaa-store.pages.dev/luxury.html
        with:
          script: |
            const marker = '<!-- raawaa-pages-preview -->';
            const body = [
              marker,
              '### Raawaa visual preview',
              '',
              `[Open the isolated PR #${context.issue.number} preview](${process.env.PREVIEW_URL})`,
              '',
              '_This is a review-only Cloudflare Pages preview. The production site has not been changed._'
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100
            });
            const existing = comments.find(comment => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body
              });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
