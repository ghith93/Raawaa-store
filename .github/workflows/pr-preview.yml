name: PR preview — Cloudflare Pages

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pages-preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: Build and publish isolated PR preview
    # Never expose Cloudflare credentials to fork-originated pull requests.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout PR merge result
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          check-latest: true
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate site and content
        run: node scripts/check-site.mjs

      - name: Build Pages output
        run: bash scripts/build-deploy.sh

      - name: Verify preview payload and isolate indexing
        run: |
          set -euo pipefail
          test -s dist/site/index.html
          test -s dist/site/serum.html
          grep -q 'لمعان يُرى، ونعومة تُلمَس' dist/site/index.html
          grep -q 'canonical" href="https://raawaa-store.pages.dev/serum"' dist/site/serum.html
          test -s dist/site/assets/brand/logo-primary-v2.svg
          test -s dist/site/assets/brand/logo-primary-v2-dark.svg
          test -s dist/site/assets/img/products/size-50-v6-720.avif
          fonts=$(find dist/site/assets/fonts -maxdepth 1 -name '*.woff2' -type f 2>/dev/null | wc -l)
          echo "Fonts in preview package: $fonts"
          test "$fonts" -ge 5
          # Preview-only noindex header: never modify production source headers.
          printf '%b' '\n/*\n  X-Robots-Tag: noindex, nofollow, noarchive\n' >> dist/site/_headers

      - name: Deploy isolated Cloudflare Pages preview
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/site --project-name=raawaa-store --branch=pr-${{ github.event.pull_request.number }} --commit-hash=${{ github.event.pull_request.head.sha }} --commit-message="Preview PR #${{ github.event.pull_request.number }}"

      - name: Verify deployed homepage, product page and noindex
        env:
          PREVIEW_URL: https://pr-${{ github.event.pull_request.number }}.raawaa-store.pages.dev
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if curl -fsSL --max-time 25 "$PREVIEW_URL/" -o /tmp/home.html; then
              break
            fi
            echo "Waiting for preview propagation ($attempt/6)"
            sleep 10
          done
          curl -fsSL --max-time 25 "$PREVIEW_URL/serum" -o /tmp/serum.html
          grep -q 'RAWAA | رواء' /tmp/home.html
          grep -q 'لمعان يُرى، ونعومة تُلمَس' /tmp/home.html
          grep -q 'canonical" href="https://raawaa-store.pages.dev/serum"' /tmp/serum.html
          curl -fsSL --max-time 25 "$PREVIEW_URL/assets/brand/logo-primary-v2.svg" -o /dev/null
          curl -fsSL --max-time 25 "$PREVIEW_URL/assets/brand/logo-primary-v2-dark.svg" -o /dev/null
          curl -fsSL --max-time 25 "$PREVIEW_URL/assets/img/products/size-50-v6-720.avif" -o /dev/null
          headers=$(curl -sSI --max-time 25 "$PREVIEW_URL/" | tr -d '\r')
          grep -qi '^x-robots-tag:.*noindex' <<< "$headers"
          echo "Verified preview homepage, product checkout, brand assets and preview-only noindex: $PREVIEW_URL"
          {
            echo "## Cloudflare Pages preview"
            echo ""
            echo "- Homepage: $PREVIEW_URL/"
            echo "- Product page: $PREVIEW_URL/serum"
            echo "- Search indexing: blocked on preview only (X-Robots-Tag: noindex)"
            echo "- Production site: untouched"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish or update PR preview comment
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          PREVIEW_URL: https://pr-${{ github.event.pull_request.number }}.raawaa-store.pages.dev/
        with:
          script: |
            const marker = '<!-- raawaa-pages-preview -->';
            const body = [
              marker,
              '### Raawaa visual preview',
              '',
              `[Open the isolated PR #${context.issue.number} homepage preview](${process.env.PREVIEW_URL})`,
              '',
              '_This is a review-only Cloudflare Pages preview. The production site has not been changed._'
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100
            });
            const existing = comments.find(comment => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body
              });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
