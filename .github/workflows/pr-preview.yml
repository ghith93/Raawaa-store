name: PR preview — Cloudflare Pages

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pages-preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: Build and publish isolated PR preview
    # Never expose Cloudflare credentials to fork-originated pull requests.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout PR merge result
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          check-latest: true
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate site and content
        run: node scripts/check-site.mjs

      - name: Build Pages output
        run: |
          bash scripts/build-deploy.sh
          # ELYRA is a concept preview only; the production build must not contain it.
          test ! -e dist/site/elyra/index.html
          mkdir -p dist/site/elyra
          cp -R elyra/. dist/site/elyra/

      - name: Verify preview payload and isolate indexing
        run: |
          set -euo pipefail
          test -s dist/site/index.html
          test -s dist/site/serum.html
          test -s dist/site/elyra/index.html
          grep -qi '<meta name="robots" content="noindex,nofollow">' dist/site/elyra/index.html
          grep -q 'هوية جديدة قيد التطوير' dist/site/elyra/index.html
          if grep -Eq '\$[0-9]|خصم[[:space:]]*[0-9]|wa\.me/' dist/site/elyra/index.html; then
            echo "::error::ELYRA preview must not expose unapproved prices, discounts, or order links"; exit 1
          fi
          grep -q 'لمعان يُرى، ونعومة تُلمَس' dist/site/index.html
          grep -q 'canonical" href="https://raawaa-store.pages.dev/serum"' dist/site/serum.html
          test -s dist/site/assets/brand/logo-primary-v2.svg
          test -s dist/site/assets/brand/logo-primary-v2-dark.svg
          test -s dist/site/assets/img/products/size-50-v6-720.avif
          fonts=$(find dist/site/assets/fonts -maxdepth 1 -name '*.woff2' -type f 2>/dev/null | wc -l)
          echo "Fonts in preview package: $fonts"
          test "$fonts" -ge 5
          # Preview-only noindex header: never modify production source headers.
          printf '%b' '\n/*\n  X-Robots-Tag: noindex, nofollow, noarchive\n' >> dist/site/_headers

      - name: Deploy isolated Cloudflare Pages preview
        id: deploy
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/site --project-name=raawaa-store --branch=pr-${{ github.event.pull_request.number }} --commit-hash=${{ github.event.pull_request.head.sha }} --commit-message="Preview PR #${{ github.event.pull_request.number }}"

      - name: Verify deployed homepage, product page and noindex
        env:
          PREVIEW_URL: https://pr-${{ github.event.pull_request.number }}.raawaa-store.pages.dev
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if curl -fsSL --max-time 25 "$PREVIEW_URL/" -o /tmp/home.html; then
              break
            fi
            echo "Waiting for preview propagation ($attempt/6)"
            sleep 10
          done
          curl -fsSL --max-time 25 "$PREVIEW_URL/serum" -o /tmp/serum.html
          curl -fsSL --max-time 25 "$PREVIEW_URL/elyra/" -o /tmp/elyra.html
          elyra_headers=$(curl -sSI --max-time 25 "$PREVIEW_URL/elyra/" | tr -d '\r')
          grep -qi '^x-robots-tag: noindex, nofollow, noarchive$' <<< "$elyra_headers"
          grep -qi '^cache-control: no-store$' <<< "$elyra_headers"
          grep -q 'هوية جديدة قيد التطوير' /tmp/elyra.html
          if grep -Eq '\$[0-9]|خصم[[:space:]]*[0-9]|wa\.me/' /tmp/elyra.html; then
            echo "::error::ELYRA preview exposed unapproved commercial claims"; exit 1
          fi
          grep -q 'RAWAA | رواء' /tmp/home.html
          grep -q 'لمعان يُرى، ونعومة تُلمَس' /tmp/home.html
          grep -q 'canonical" href="https://raawaa-store.pages.dev/serum"' /tmp/serum.html
          curl -fsSL --max-time 25 "$PREVIEW_URL/assets/brand/logo-primary-v2.svg" -o /dev/null
          curl -fsSL --max-time 25 "$PREVIEW_URL/assets/brand/logo-primary-v2-dark.svg" -o /dev/null
          curl -fsSL --max-time 25 "$PREVIEW_URL/assets/img/products/size-50-v6-720.avif" -o /dev/null
          headers=$(curl -sSI --max-time 25 "$PREVIEW_URL/" | tr -d '\r')
          grep -qi '^x-robots-tag:.*noindex' <<< "$headers"
          echo "Verified preview homepage, product checkout, brand assets and preview-only noindex: $PREVIEW_URL"
          {
            echo "## Cloudflare Pages preview"
            echo ""
            echo "- Homepage: $PREVIEW_URL/"
            echo "- Product page: $PREVIEW_URL/serum"
            echo "- ELYRA concept preview: $PREVIEW_URL/elyra/ (noindex, no pricing or order links)"
            echo "- Search indexing: blocked on preview only (X-Robots-Tag: noindex)"
            echo "- Production site: untouched"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish or update PR preview comment
        uses: actions/github-script@v8
        env:
          PREVIEW_URL: https://pr-${{ github.event.pull_request.number }}.raawaa-store.pages.dev/
        with:
          script: |
            const marker = '<!-- raawaa-pages-preview -->';
            const body = [
              marker,
              '### Raawaa visual preview',
              '',
              `[Open the isolated PR #${context.issue.number} homepage preview](${process.env.PREVIEW_URL})`,
              '',
              `[Open the isolated ELYRA concept preview](https://pr-${context.issue.number}.raawaa-store.pages.dev/elyra/)`,
              '',
              '_This is a review-only Cloudflare Pages preview. ELYRA remains noindex and is excluded from production builds._'
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100
            });
            const existing = comments.find(comment => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body
              });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
 <<< "$elyra_headers"
          grep -qi '^cache-control: no-store
          grep -qi '<meta name="robots" content="noindex,nofollow">' /tmp/elyra.html
          grep -q 'هوية جديدة قيد التطوير' /tmp/elyra.html
          if grep -Eq '\$[0-9]|خصم[[:space:]]*[0-9]|wa\.me/' /tmp/elyra.html; then
            echo "::error::ELYRA preview exposed unapproved commercial claims"; exit 1
          fi
