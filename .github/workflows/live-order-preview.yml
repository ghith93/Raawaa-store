name: اختبار مراقبة إعدادات الطلب قبل النشر

# فحص للفرع فقط: لا ينشر ولا يغيّر بيانات الموقع أو إعدادات GitHub.
# عند تغيير سعر في الفرع عمدًا يظهر اختلاف متوقع لأن الموقع ما زال يعرض إصدار
# main؛ يُسجَّل تحذيرًا على الفرع ولا يحجب الدمج، ويبقى الفشل على main وبعد النشر.
on:
  push:
    branches-ignore:
      - main
    paths:
      - 'js/config.js'
      - 'scripts/order-config-monitor.mjs'
      - 'scripts/strip-internal-config.mjs'
      - 'scripts/order-config-monitor.test.mjs'
      - 'scripts/lib/public-config.mjs'
      - 'scripts/published-config-contract.test.mjs'
      - '.github/workflows/live-order-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-order-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    name: اختبار المقارنة مع الموقع الحي
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          check-latest: true
      - name: اختبار منطق المراقب
        run: node --test scripts/order-config-monitor.test.mjs
      # يفشل هذا قبل مقارنة الشبكة إن انحرف مخرَج البناء عن القارئ الحيّ.
      - name: عقد الإعدادات المنشورة
        run: node --test scripts/published-config-contract.test.mjs
      # على فرع: سياسة/سعر معدّل بقرار المالك قبل النشر يُنتج اختلافًا متوقعًا
      # مع النسخة الحيّة. نفشل فقط عند عدم توقّع الاختلاف: على main، أو عند
      # وجود علامة RAWAA_EXPECT_LIVE_DRIFT غير المضبوطة.
      # الغرض: ألا يمنع قرارُ تسعيرٍ شرعيٌّ الدمجَ، وألا يمرّ انحراف حقيقي.
      # السياسة المعتمدة: هذا الفحص للفرع **لا يحجب الدمج**.
      #
      # السبب: هو يقارن شجرةَ الفرع بالموقع الحيّ، والموقع الحيّ يعرض `main` حتى
      # يتم النشر. فأي تعديل تسعير مقصود (كهذا) يُنتج اختلافًا **متوقعًا**، ولا
      # يصبح صحيحًا إلا بعد النشر — أي بعد الدمج الذي يمنعه. هذا فخّ منطقي:
      # الفحص نفسه هو ما يجعل الدمج مستحيلًا.
      #
      # لذلك: على الفرع يُسجَّل الاختلاف كتحذير مع محتواه الكامل للاطّلاع، ويمرّ.
      # أما على `main` (أو بعد النشر) فيبقى الفشل فشلًا: التحقق الحقيقي هو
      # `scripts/published-config-contract.test.mjs` وإعادةُ المقارنة بعد النشر.
      - name: مقارنة إعدادات الطلب بالإصدار الحي
        run: |
          set +e
          OUTPUT=$(node scripts/order-config-monitor.mjs 2>&1)
          STATUS=$?
          set -e
          printf '%s\n' "$OUTPUT"
          if [ "$STATUS" = "0" ]; then exit 0; fi
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::warning::اختلاف متوقع: الفرع يعدّل التسعير عمدًا والموقع الحيّ ما زال على إصدار main. تُعاد المقارنة بعد النشر."
            exit 0
          fi
          exit $STATUS
