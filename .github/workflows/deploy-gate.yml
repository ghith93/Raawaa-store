name: Deploy gate

# الحماية الوحيدة الممكنة بلا مفاتيح إضافية:
# إذا فشل أي فحص على main نُنشئ Issue تلقائيًا يوقف الإصدار ويُنذر.
# (GitHub Pages ينشر من الفرع مباشرة، ولا يمكن تعليقه من داخل Actions.)

on:
  workflow_run:
    workflows: ["Site checks"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: deploy-gate
  cancel-in-progress: true

jobs:
  gate:
    name: بوابة النشر
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion != 'success'
    steps:
      - name: إنشاء تنبيه إصدار عند فشل الفحوصات
        uses: actions/github-script@v9
        with:
          script: |
            const run = context.payload.workflow_run;
            const head = run ? run.head_sha.slice(0, 7) : 'غير معروف';
            const url = run ? run.html_url : '';
            const title = `⛔ فشل فحص على main — الإصدار الحالي غير موثوق (${head})`;
            const body = [
              '## فشل السير العمل «Site checks» على فرع main',
              '',
              `- **الالتزام:** \`${head}\``,
              `- **التشغيل:** ${url}`,
              '',
              'الموقع المنشور الآن **قد يحتوي عيبًا**. الخطوات:',
              '1. افتح رابط التشغيل أعلاه واقرأ الخطوة الفاشلة.',
              '2. أصلح السبب أو ارجع للالتزام السابق.',
              '3. أغلق هذه المشكلة بعد نجاح الفحوصات.',
              '',
              '_أُنشئت تلقائيًا بواسطة Deploy gate._',
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'deploy-gate'
            });
            // عنوان واحد لكل فشل = 28 Issue مفتوحة في يوم واحد. الهدف: تنبيه
            // واحد مفتوح يعيش حتى تُصلح المشكلة، لا سجلّ لكل التزام فاشل.
            if (existing.data.some(i => i.labels.some(l => (l.name || l) === 'deploy-gate'))) {
              core.info('تنبيه مطابق موجود بالفعل — لا تكرار.');
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title, body, labels: ['deploy-gate']
            });
