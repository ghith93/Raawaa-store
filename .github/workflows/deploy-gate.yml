name: Deploy gate

# الحماية الوحيدة الممكنة بلا مفاتيح إضافية:
# إذا فشل الفحص أو انتهى بمهلة/يتطلب إجراءً على main، ننشئ تنبيهًا.
# لا يُعد الإلغاء أو التخطي دليلًا على فشل، لذلك لا ينشئ تنبيهًا.

on:
  workflow_run:
    workflows: ["Site checks"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: deploy-gate
  cancel-in-progress: true

jobs:
  gate:
    name: بوابة النشر
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: github.event_name == 'workflow_dispatch' || contains(fromJSON('["failure","timed_out","startup_failure","action_required"]'), github.event.workflow_run.conclusion)
    steps:
      - name: إنشاء تنبيه عند فشل الفحوصات أو تعذرها
        uses: actions/github-script@v9
        with:
          script: |
            const run = context.payload.workflow_run;
            const head = run ? run.head_sha.slice(0, 7) : 'غير معروف';
            const url = run ? run.html_url : '';
            const conclusion = run?.conclusion || 'تشغيل يدوي';
            const title = `⛔ فحص main لم يكتمل بنجاح — (${head})`;
            const body = [
              '## لم يكتمل فحص «Site checks» على فرع main بنجاح',
              '',
              `- **النتيجة:** ${conclusion}`,
              '',
              `- **الالتزام:** \`${head}\``,
              `- **التشغيل:** ${url}`,
              '',
              'الموقع المنشور الآن **قد يحتوي عيبًا**. الخطوات:',
              '1. افتح رابط التشغيل أعلاه وحدد النتيجة والخطوة الفاشلة أو المتوقفة.',
              '2. أصلح السبب أو أعد التشغيل بعد معالجة العائق.',
              '3. أغلق هذه المشكلة بعد نجاح الفحوصات.',
              '',
              '_أُنشئت تلقائيًا بواسطة Deploy gate._',
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'deploy-gate'
            });
            // تنبيه واحد مفتوح لكل حادثة: لا ننشئ نسخة لكل التزام فاشل.
            if (existing.data.some(i => i.labels.some(l => (l.name || l) === 'deploy-gate'))) {
              core.info('تنبيه مطابق موجود بالفعل — لا تكرار.');
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title, body, labels: ['deploy-gate']
            });
