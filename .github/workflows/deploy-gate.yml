name: Deploy gate

# الحماية الوحيدة الممكنة بلا مفاتيح إضافية:
# إذا فشل الفحص أو انتهى بمهلة/يتطلب إجراءً على main، ننشئ تنبيهًا.
# لا يُعد الإلغاء أو التخطي دليلًا على فشل، لذلك لا ينشئ تنبيهًا.
#
# 🔁 الإغلاق التلقائي (أُضيف ٦ نوفمبر ٢٠٢٦): عندما ينجح «Site checks» على main
# نُغلق أي تنبيه مفتوح بوسم deploy-gate. سابقًا كان التنبيه يُفتح ولا يُغلق أبدًا،
# فتراكم issue #133 على التزام 48b0902 بعد أن صار قديمًا، ومع الوقت يفقد التنبيه
# معناه: المالك يرى تنبيهات مفتوحة دائمًا فيتجاهلها، فيضيع التنبيه الحقيقي.

on:
  workflow_run:
    workflows: ["Site checks"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: deploy-gate
  cancel-in-progress: true

jobs:
  gate:
    name: بوابة النشر
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # قائمة سماح صريحة لا نفي: الإلغاء والتخطي ليسا فشلًا، و'conclusion != success'
    # كان سيعاملهما كحادثة. النجاح مذكور صراحةً لأنه المسار الذي يُغلق التنبيه.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(fromJSON('["failure","timed_out","startup_failure","action_required"]'), github.event.workflow_run.conclusion) ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    steps:
      - name: إغلاق تنبيه سابق عند نجاح الفحوصات
        if: github.event.workflow_run.conclusion == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', labels: 'deploy-gate', per_page: 100
            });
            if (!open.length) {
              core.info('لا تنبيه مفتوح لإغلاقه.');
              return;
            }
            for (const issue of open) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: [
                  'أُغلق تلقائيًا: نجحت فحوص `Site checks` على `main` بعد آخر إخفاق.',
                  '',
                  `- **الالتزام الناجح:** \`${context.payload.workflow_run.head_sha.slice(0, 7)}\``,
                  `- **التشغيل:** ${context.payload.workflow_run.html_url}`,
                  '',
                  'إن كان التنبيه يشير إلى عطل تشغيلي حقيقي (مراقبة الموقع الحيّ مثلًا) فتأكد من إصلاحه قبل الاعتماد على هذا الإغلاق: نجاح فحوص المستودع لا يثبت سلامة الإنتاج.'
                ].join('\n')
              });
              await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: 'closed' });
              core.info(`أُغلق التنبيه #${issue.number}.`);
            }

      - name: إنشاء تنبيه عند فشل الفحوصات أو تعذرها
        if: >-
          github.event_name == 'workflow_dispatch' ||
          contains(fromJSON('["failure","timed_out","startup_failure","action_required"]'), github.event.workflow_run.conclusion)
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const run = context.payload.workflow_run;
            const head = run ? run.head_sha.slice(0, 7) : 'غير معروف';
            const url = run ? run.html_url : '';
            const conclusion = run?.conclusion || 'تشغيل يدوي';
            const title = `⛔ فحص main لم يكتمل بنجاح — (${head})`;
            const body = [
              '## لم يكتمل فحص «Site checks» على فرع main بنجاح',
              '',
              `- **النتيجة:** ${conclusion}`,
              '',
              `- **الالتزام:** \`${head}\``,
              `- **التشغيل:** ${url}`,
              '',
              'الموقع المنشور الآن **قد يحتوي عيبًا**. الخطوات:',
              '1. افتح رابط التشغيل أعلاه وحدد النتيجة والخطوة الفاشلة أو المتوقفة.',
              '2. أصلح السبب أو أعد التشغيل بعد معالجة العائق.',
              '3. أغلق هذه المشكلة بعد نجاح الفحوصات.',
              '',
              '_أُنشئت تلقائيًا بواسطة Deploy gate._',
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'deploy-gate'
            });
            // تنبيه واحد مفتوح لكل حادثة: لا ننشئ نسخة لكل التزام فاشل.
            if (existing.data.some(i => i.labels.some(l => (l.name || l) === 'deploy-gate'))) {
              core.info('تنبيه مطابق موجود بالفعل — لا تكرار.');
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title, body, labels: ['deploy-gate']
            });
