name: المراقبة الدورية للموقع الحيّ

# يفحص الموقع المنشور فعليًا كل 6 ساعات، ويفشل إن تعطّل.
# السبب: لو تعطّل الموقع لا نعرف إلا إذا أخبرتنا زبونة. هذا يخبرنا نحن أولًا.
# بلا تكلفة: GitHub Actions مجاني للمستودعات العامة.

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  uptime:
    name: فحص الموقع المنشور
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: فحص الصفحات والأصول الأساسية
        run: |
          BASE="https://raawaa-store.pages.dev"
          FAIL=0
          # تتبع تحويلات Pages الطبيعية (.html → رابط نظيف)، ثم افحص الرمز النهائي.
          for path in "" "serum" "privacy.html" "manifest.webmanifest" "sw.js" \
                      "css/styles.css" "css/serum.css" "js/config.js" "js/cart.js" "js/marketing.js" \
                      "assets/icons/apple-touch-icon.png" \
                      "assets/img/products/trio-v5-480.avif" \
                      "sitemap.xml" "robots.txt"; do
            CODE=$(curl -sSL -o /dev/null -w "%{http_code}" --max-time 25 --retry 3 --retry-delay 5 "$BASE/$path") || CODE=000
            if [ "$CODE" != "200" ]; then
              echo "✗ /$path => $CODE"
              FAIL=1
            else
              echo "✓ /$path"
            fi
          done
          if [ "$FAIL" = "1" ]; then
            echo "::error::الموقع المنشور به مسارات لا تعمل"
            exit 1
          fi

      - name: فحص المحتوى الحرج في الصفحة الرئيسية
        run: |
          HTML=$(curl -fsSL --max-time 25 --retry 3 "https://raawaa-store.pages.dev/")
          for needle in "RAWAA" "رواء" "data-add-current" "963997310856" "شام كاش"; do
            if grep -qF "$needle" <<< "$HTML"; then
              echo "✓ يحتوي: $needle"
            else
              echo "::error::الصفحة الرئيسية لا تحتوي: $needle"
              exit 1
            fi
          done

      - name: صفحة المنتج ومسار الطلب
        run: |
          HTML=$(curl -fsSL --max-time 25 --retry 3 "https://raawaa-store.pages.dev/serum")
          for needle in "سيروم زيوت" "data-add-current" "data-cart-checkout" "البانثينول"; do
            if grep -qF "$needle" <<< "$HTML"; then echo "✓ المنتج: $needle"; else echo "::error::صفحة المنتج تفتقد: $needle"; exit 1; fi
          done

      - name: تثبيت Playwright
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium

      - name: اختبار وظيفي كامل على الموقع المنشور
        run: python scripts/browser-test.py --base https://raawaa-store.pages.dev

  assets:
    name: كل الأصول تُفتح على الموقع الحيّ
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: تدقيق الأصول
        run: node scripts/asset-audit.mjs

  content-check:
    name: تحقق من المحتوى الحيّ (أسعار + خط)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: الأسعار الحيّة مطابقة للإعداد
        run: |
          BODY=$(curl -s --max-time 20 https://raawaa-store.pages.dev/js/config.js)
          FAIL=0
          for pair in "price: 10:30" "price: 12:50" "price: 15:100"; do
            NEEDLE="${pair%:*}"
            if grep -qF "$NEEDLE" <<< "$BODY"; then echo "✓ $pair"; else echo "✗ سعر مفقود: $pair"; FAIL=1; fi
          done
          exit $FAIL
      - name: الخط الجديد منشور فعلًا
        run: |
          CODE=$(curl -s -o /dev/null -w "%{http_code}" https://raawaa-store.pages.dev/assets/fonts/plexar-400.subset.woff2)
          echo "plexar-400 → $CODE"; [ "$CODE" = "200" ]
      - name: لا مراجع الصور القديمة في الصفحتين
        run: |
          for path in "" "serum"; do
            HTML=$(curl -fsSL --max-time 20 --retry 3 "https://raawaa-store.pages.dev/$path")
            IMAGES=$(printf '%s' "$HTML" | grep -oE 'products/[a-z0-9-]+-v[0-9]+-[0-9]+\.(avif|webp|jpg)' || true)
            if [ -z "$IMAGES" ]; then echo "::error::لا صور منتجات مرقّمة في /$path"; exit 1; fi
            OLD=$(printf '%s\n' "$IMAGES" | grep -E -- '-v[1-4]-' || true)
            if [ -n "$OLD" ]; then echo "::error::مراجع صور قديمة في /$path"; echo "$OLD"; exit 1; fi
            echo "✓ صور /$path مرقّمة وحديثة؛ تدقيق وجود الأصول في المهمة المستقلة"
          done

  quality:
    name: أبواب الجودة (axe + Lighthouse)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: تثبيت المتطلبات
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: تثبيت أدوات Lighthouse بالإصدارات المقفلة
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: تدقيق إمكانية الوصول (axe-core)
        run: python scripts/axe-audit.py --fail-on serious
      - name: ميزانية الصفحة الرئيسية (وسيط 3 قراءات)
        run: node scripts/perf-budget.mjs
      - name: ميزانية صفحة السيروم (وسيط 3 قراءات)
        if: ${{ !cancelled() }}
        env:
          BASE: https://raawaa-store.pages.dev/serum
          PERF_REPORT: BENCHMARKS-serum.json
        run: node scripts/perf-budget.mjs
      - name: حفظ قراءات الأداء حتى عند الإخفاق
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: lighthouse-live
          path: |
            BENCHMARKS-lighthouse-latest.json
            BENCHMARKS-serum.json
          if-no-files-found: warn
