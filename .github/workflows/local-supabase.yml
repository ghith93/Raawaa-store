name: Isolated local Supabase probe

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/local-supabase.yml'
      - 'scripts/test-marketing-supabase-local.sh'
      - 'order-system/marketing-preferences-supabase-test.sql'
      # أي هجرة، لا 005 وحدها: الفحص الآن يبني السلسلة الكاملة 001..006.
      - 'order-system/migrations/**'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Reuse the previous key so this hosted run can replace its queued runner-bound job.
  group: lenovo-local-supabase-probe
  cancel-in-progress: true

jobs:
  local-supabase:
    name: Check hosted Docker and run isolated local SQL tests
    # Run reviewed code from main only; never execute pull-request or arbitrary branch code.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout trusted branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3
        with:
          version: 2.122.0

      - name: Report only non-sensitive runner capabilities
        shell: bash
        run: |
          set -euo pipefail
          printf 'Architecture: '; uname -m
          printf 'Kernel: '; uname -sr
          printf 'CPU cores: '; nproc
          printf 'Workspace disk: '; df -h "$GITHUB_WORKSPACE" | tail -n 1
          printf 'Docker daemon: '; docker version --format '{{.Server.Version}}'
          printf 'Supabase CLI: '; supabase --version

      - name: Run isolated local Supabase migration and pgTAP tests
        run: npm run test:marketing:supabase-local
