name: Rawaa read-only AI advisor
on:
  pull_request:
    paths:
      - 'manager/**'
      - '.github/workflows/ai-advisor.yml'
  push:
    branches: [main]
    paths:
      - 'manager/**'
      - '.github/workflows/ai-advisor.yml'
  schedule:
    - cron: '47 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rawaa-ai-advisor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: node --test manager/*.test.mjs

  advisory:
    # Never pass credentials to pull requests or arbitrary branches. Disabled until
    # the owner confirms the free plan and deliberately sets the repository variable.
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push') && github.ref == 'refs/heads/main' && vars.RAWAA_AI_FREE_PLAN_CONFIRMED == 'true'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Read-only report
        env:
          RAWAA_AI_FREE_PLAN_CONFIRMED: ${{ vars.RAWAA_AI_FREE_PLAN_CONFIRMED }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.RAWAA_AI_ACCOUNT_ID }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.RAWAA_AI_TOKEN }}
        run: node manager/advisor.mjs
