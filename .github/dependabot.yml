# Dependabot — تحديثات أمنية تلقائية، مجانية تمامًا للمستودعات العامة.
# التنبيهات مفعّلة. هذا الملف يغطي أدوات Actions المستخدمة في السير العمل،
# وهي سطح الهجوم الوحيد الحقيقي في هذا المشروع (لا تبعيات npm/pip في الموقع نفسه).

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"

  # حزم بايثون موجودة فقط في سكربتات التوليد والاختبار المحلية،
  # وليست جزءًا من الموقع المنشور — تُحدَّث يدويًا عند الحاجة.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "dev"
    labels:
      - "dependencies"
