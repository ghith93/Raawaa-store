<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1568" height="1120" viewBox="0 0 1568 1120" role="img" aria-labelledby="title desc">
  <title id="title">تصور تصميمي لعبوات سيروم رواء، مستلهم من مبادئ فخامة عالمية دون نسخ</title>
  <desc id="desc">ثلاث عبوات CGI غير مصنّعة، بملصق زيتوني وورقي عاجي؛ الشعار المعتمد وأسماء الأحجام الحقيقية مضافان كطبقة متجهية. لا يمثل الشكل عينة إنتاج ولا ملصقًا قانونيًا.</desc>
  <image x="0" y="0" width="1568" height="1040" preserveAspectRatio="none" href="rawaa-world-benchmark-direction.png" xlink:href="rawaa-world-benchmark-direction.png"/>
  <defs>
    <g id="rawaa-mark">
      <image x="0" y="0" width="1120" height="420" preserveAspectRatio="xMidYMid meet" href="../../assets/brand/logo-primary-v2.svg" xlink:href="../../assets/brand/logo-primary-v2.svg"/>
    </g>
    <style>
      .label-ar{font-family:Amiri,"Noto Naskh Arabic",serif;fill:#302b24;text-anchor:middle;direction:rtl;unicode-bidi:plaintext}
      .label-en{font-family:"Cormorant Garamond",Georgia,serif;fill:#6c5636;text-anchor:middle;letter-spacing:2px}
      .volume{font-family:"Cormorant Garamond",Georgia,serif;fill:#302b24;text-anchor:middle;letter-spacing:1.3px}
    </style>
  </defs>
  <!-- 100 mL -->
  <g aria-label="معلومات تصور ملصق 100 مل">
    <use xlink:href="#rawaa-mark" x="694" y="625" width="184" height="69"/>
    <text class="label-ar" x="784" y="766" font-size="22">سيروم زيوت للشعر</text>
    <text class="label-en" x="784" y="793" font-size="13">HAIR SERUM</text>
    <line x1="734" y1="813" x2="834" y2="813" stroke="#9A7B45" stroke-width="1.5"/>
    <text class="volume" x="784" y="850" font-size="19">100 mL · 100 مل</text>
  </g>
  <!-- 50 mL -->
  <g aria-label="معلومات تصور ملصق 50 مل">
    <use xlink:href="#rawaa-mark" x="376" y="707" width="132" height="50"/>
    <text class="label-ar" x="442" y="801" font-size="16">سيروم زيوت للشعر</text>
    <text class="label-en" x="442" y="823" font-size="9.5">HAIR SERUM</text>
    <line x1="412" y1="837" x2="472" y2="837" stroke="#9A7B45" stroke-width="1"/>
    <text class="volume" x="442" y="866" font-size="14">50 mL · 50 مل</text>
  </g>
  <!-- 30 mL -->
  <g aria-label="معلومات تصور ملصق 30 مل">
    <use xlink:href="#rawaa-mark" x="1060" y="760" width="132" height="50"/>
    <text class="label-ar" x="1126" y="839" font-size="15">سيروم زيوت للشعر</text>
    <text class="label-en" x="1126" y="858" font-size="9">HAIR SERUM</text>
    <line x1="1096" y1="870" x2="1156" y2="870" stroke="#9A7B45" stroke-width="1"/>
    <text class="volume" x="1126" y="894" font-size="13">30 mL · 30 مل</text>
  </g>
  <rect x="0" y="1040" width="1568" height="80" fill="#f5f0e7"/>
  <text x="784" y="1088" text-anchor="middle" font-family="Amiri,serif" font-size="21" fill="#484239" direction="rtl">تصوّر تصميمي للهوية والملصق — ليس عبوة مُصنّعة ولا ملصقًا قانونيًا نهائيًا</text>
</svg>
