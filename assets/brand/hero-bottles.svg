<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" width="900" height="900">
  <defs>
    <!-- تدرّج ضوء الاستوديو: بقعة ناعمة أعلى اليسار -->
    <radialGradient id="studio" cx="34%" cy="24%" r="82%">
      <stop offset="0%"  stop-color="#FBF7F0"/>
      <stop offset="52%" stop-color="#F3ECE1"/>
      <stop offset="100%" stop-color="#E2D7C7"/>
    </radialGradient>

    <!-- زجاج كهرماني شفّاف: أفتح في المنتصف، أغمق على الحافتين -->
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#7A3E0C"/>
      <stop offset="9%"   stop-color="#A85D14"/>
      <stop offset="26%"  stop-color="#D08A2E"/>
      <stop offset="42%"  stop-color="#E8AD55"/>
      <stop offset="56%"  stop-color="#D68F31"/>
      <stop offset="74%"  stop-color="#A85D14"/>
      <stop offset="91%"  stop-color="#6E360A"/>
      <stop offset="100%" stop-color="#552707"/>
    </linearGradient>

    <!-- لمعة عمودية حادة على الزجاج -->
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#FFF3DC" stop-opacity="0"/>
      <stop offset="45%"  stop-color="#FFF8E8" stop-opacity="0.72"/>
      <stop offset="58%"  stop-color="#FFF8E8" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#FFF3DC" stop-opacity="0"/>
    </linearGradient>

    <!-- قطّارة سوداء مصقولة -->
    <linearGradient id="cap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#050505"/>
      <stop offset="10%"  stop-color="#1A1918"/>
      <stop offset="24%"  stop-color="#33302C"/>
      <stop offset="33%"  stop-color="#6B6560"/>
      <stop offset="39%"  stop-color="#8C857D"/>
      <stop offset="46%"  stop-color="#3D3934"/>
      <stop offset="64%"  stop-color="#161513"/>
      <stop offset="82%"  stop-color="#0A0908"/>
      <stop offset="100%" stop-color="#030303"/>
    </linearGradient>

    <linearGradient id="rubber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#080707"/>
      <stop offset="20%"  stop-color="#2B2724"/>
      <stop offset="34%"  stop-color="#57504A"/>
      <stop offset="44%"  stop-color="#2A2622"/>
      <stop offset="70%"  stop-color="#141211"/>
      <stop offset="100%" stop-color="#050404"/>
    </linearGradient>

    <!-- لمعة علوية ناعمة تعطي إحساس الزجاج المصقول -->
    <linearGradient id="capGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="26%"  stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="70%"  stop-color="#FFFFFF" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- ملصق عاجي مع ظل خفيف -->
    <linearGradient id="label" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#EFE6D6"/>
      <stop offset="14%"  stop-color="#F8F2E7"/>
      <stop offset="50%"  stop-color="#FCF8F1"/>
      <stop offset="86%"  stop-color="#F6EFE2"/>
      <stop offset="100%" stop-color="#E7DCC9"/>
    </linearGradient>

    <!-- أرضية رخامية ناعمة -->
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#DDD2C1"/>
      <stop offset="45%"  stop-color="#E9E0D1"/>
      <stop offset="100%" stop-color="#F2EBDF"/>
    </linearGradient>

    <!-- ظل أفقي واقعي على الأرضية -->
    <radialGradient id="floorShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#6B5B45" stop-opacity="0.48"/>
      <stop offset="55%"  stop-color="#6B5B45" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#6B5B45" stop-opacity="0"/>
    </radialGradient>

    <!-- انعكاس الزجاج على الأرضية -->
    <linearGradient id="reflection" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%"   stop-color="#B8762A" stop-opacity="0"/>
      <stop offset="55%"  stop-color="#C5832F" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#D9973C" stop-opacity="0.30"/>
    </linearGradient>

    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="tight" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- خلفية الاستوديو -->
  <!-- خط التقاء الجدار بالأرضية -->

  <g id="bottles">

    <!-- ═══════════ 30 مل — الزجاجة الصغيرة (يمين) ═══════════ -->
    <g transform="translate(590 0)">
      <ellipse cx="110" cy="626" rx="88" ry="15" fill="url(#floorShadow)"/>
      <ellipse cx="110" cy="632" rx="72" ry="9" fill="#5A4A34" opacity="0.30"/>
      <rect x="52" y="632" width="116" height="86" fill="url(#reflection)" filter="url(#tight)"/>

      <!-- جسم [30 مل: 250 ارتفاع] -->
      <path d="M 62 372
               C 62 356 66 346 78 340
               L 78 330 L 142 330 L 142 340
               C 154 346 158 356 158 372
               L 158 596 C 158 614 150 622 132 622
               L 88 622 C 70 622 62 614 62 596 Z"
            fill="url(#glass)"/>
      <!-- حدّ الزجاج -->
      <path d="M 62 372 C 62 356 66 346 78 340 L 78 330 L 142 330 L 142 340
               C 154 346 158 356 158 372 L 158 596 C 158 614 150 622 132 622
               L 88 622 C 70 622 62 614 62 596 Z"
            fill="none" stroke="#5B2C07" stroke-opacity="0.5" stroke-width="1.6"/>
      <!-- لمعة -->
      <rect x="76" y="352" width="26" height="252" rx="13" fill="url(#sheen)" opacity="0.85"/>
      <!-- قاعدة أثقل -->
      <path d="M 62 590 L 158 590 L 158 596 C 158 614 150 622 132 622 L 88 622
               C 70 622 62 614 62 596 Z" fill="#4A1F05" opacity="0.30"/>

      <!-- عنق -->
      <rect x="92" y="286" width="36" height="46" fill="url(#glass)"/>
      <rect x="92" y="286" width="10" height="46" fill="#FFF3DC" opacity="0.35"/>

      <!-- طوق معدني -->
      <rect x="86" y="276" width="48" height="14" rx="3" fill="#B08A4E"/>
      <rect x="86" y="276" width="48" height="5" rx="2" fill="#E5C98F" opacity="0.75"/>

      <!-- قطّارة -->
      <rect x="80" y="188" width="60" height="92" rx="9" fill="url(#cap)"/>
      <path d="M 88 248 L 132 248 L 132 272 C 132 276 128 278 124 278
               L 96 278 C 92 278 88 276 88 272 Z" fill="url(#rubber)"/>
      <rect x="86" y="192" width="13" height="84" rx="6" fill="#FFFFFF" opacity="0.20"/>
      <rect x="80" y="188" width="60" height="92" rx="9" fill="url(#capGloss)"/>
      <ellipse cx="110" cy="190" rx="30" ry="6" fill="#1C1A18"/>
      <ellipse cx="110" cy="189" rx="21" ry="3.4" fill="#4A443E" opacity="0.7"/>

      <!-- ملصق -->
      <rect x="70" y="404" width="80" height="126" rx="2" fill="url(#label)"/>
      <rect x="70" y="404" width="80" height="126" rx="2" fill="none"
            stroke="#C8B89C" stroke-opacity="0.8" stroke-width="0.9"/>
      <text x="110" y="446" text-anchor="middle" textLength="62"
            lengthAdjust="spacing" font-family="DejaVu Serif, serif"
            font-size="19" fill="#231F1B">RAWAA</text>
      <line x1="88" y1="458" x2="132" y2="458" stroke="#9A7B45" stroke-width="1"/>
      <text x="110" y="484" text-anchor="middle"
            font-family="DejaVu Sans, sans-serif" font-size="10.5"
            letter-spacing="1.8" fill="#6B5B45">HAIR SERUM</text>
      <text x="110" y="514" text-anchor="middle"
            font-family="DejaVu Sans, sans-serif" font-size="11"
            letter-spacing="1.2" fill="#9A7B45">30 ML</text>

      <!-- انعكاس الملصق على الزجاج -->
      <rect x="70" y="530" width="80" height="126" fill="url(#reflection)" opacity="0.35"/>
    </g>

    <!-- ═══════════ 100 مل — الزجاجة الكبيرة (وسط) ═══════════ -->
    <g transform="translate(370 0)">
      <ellipse cx="80" cy="628" rx="96" ry="16" fill="url(#floorShadow)"/>
      <ellipse cx="80" cy="634" rx="80" ry="10" fill="#5A4A34" opacity="0.30"/>
      <rect x="14" y="634" width="132" height="94" fill="url(#reflection)" filter="url(#tight)"/>

      <!-- جسم [100 مل: 316 ارتفاع، 112 عرض] -->
      <path d="M 24 330
               C 24 312 29 300 44 294
               L 44 282 L 116 282 L 116 294
               C 131 300 136 312 136 330
               L 136 592 C 136 614 126 624 104 624
               L 56 624 C 34 624 24 614 24 592 Z"
            fill="url(#glass)"/>
      <path d="M 24 330 C 24 312 29 300 44 294 L 44 282 L 116 282 L 116 294
               C 131 300 136 312 136 330 L 136 592 C 136 614 126 624 104 624
               L 56 624 C 34 624 24 614 24 592 Z"
            fill="none" stroke="#5B2C07" stroke-opacity="0.5" stroke-width="1.8"/>
      <rect x="40" y="310" width="30" height="290" rx="15" fill="url(#sheen)" opacity="0.88"/>
      <path d="M 24 586 L 136 586 L 136 592 C 136 614 126 624 104 624 L 56 624
               C 34 624 24 614 24 592 Z" fill="#4A1F05" opacity="0.30"/>

      <!-- عنق -->
      <rect x="60" y="238" width="40" height="46" fill="url(#glass)"/>
      <rect x="60" y="238" width="11" height="46" fill="#FFF3DC" opacity="0.35"/>

      <!-- طوق -->
      <rect x="53" y="226" width="54" height="15" rx="3" fill="#B08A4E"/>
      <rect x="53" y="226" width="54" height="5" rx="2" fill="#E5C98F" opacity="0.75"/>

      <!-- قطّارة -->
      <rect x="47" y="130" width="66" height="100" rx="10" fill="url(#cap)"/>
      <path d="M 56 196 L 104 196 L 104 222 C 104 227 100 229 96 229
               L 64 229 C 60 229 56 227 56 222 Z" fill="url(#rubber)"/>
      <rect x="55" y="134" width="14" height="90" rx="7" fill="#FFFFFF" opacity="0.20"/>
      <rect x="47" y="130" width="66" height="100" rx="10" fill="url(#capGloss)"/>
      <ellipse cx="80" cy="132" rx="33" ry="6.5" fill="#1C1A18"/>
      <ellipse cx="80" cy="131" rx="23" ry="3.7" fill="#4A443E" opacity="0.7"/>

      <!-- ملصق -->
      <rect x="34" y="366" width="92" height="146" rx="2" fill="url(#label)"/>
      <rect x="34" y="366" width="92" height="146" rx="2" fill="none"
            stroke="#C8B89C" stroke-opacity="0.8" stroke-width="0.9"/>
      <text x="80" y="414" text-anchor="middle" textLength="72"
            lengthAdjust="spacing" font-family="DejaVu Serif, serif"
            font-size="22" fill="#231F1B">RAWAA</text>
      <line x1="54" y1="428" x2="106" y2="428" stroke="#9A7B45" stroke-width="1"/>
      <text x="80" y="458" text-anchor="middle"
            font-family="DejaVu Sans, sans-serif" font-size="11"
            letter-spacing="2" fill="#6B5B45">HAIR SERUM</text>
      <text x="80" y="492" text-anchor="middle"
            font-family="DejaVu Sans, sans-serif" font-size="12"
            letter-spacing="1.4" fill="#9A7B45">100 ML</text>
    </g>

    <!-- ═══════════ 50 مل — الزجاجة الوسطى (يسار) ═══════════ -->
    <g transform="translate(178 0)">
      <ellipse cx="106" cy="626" rx="92" ry="15" fill="url(#floorShadow)"/>
      <ellipse cx="106" cy="632" rx="76" ry="9" fill="#5A4A34" opacity="0.30"/>
      <rect x="40" y="632" width="128" height="90" fill="url(#reflection)" filter="url(#tight)"/>

      <!-- جسم [50 مل: 282 ارتفاع، 100 عرض] -->
      <path d="M 56 352
               C 56 334 61 322 76 316
               L 76 304 L 136 304 L 136 316
               C 151 322 156 334 156 352
               L 156 592 C 156 612 147 622 127 622
               L 85 622 C 65 622 56 612 56 592 Z"
            fill="url(#glass)"/>
      <path d="M 56 352 C 56 334 61 322 76 316 L 76 304 L 136 304 L 136 316
               C 151 322 156 334 156 352 L 156 592 C 156 612 147 622 127 622
               L 85 622 C 65 622 56 612 56 592 Z"
            fill="none" stroke="#5B2C07" stroke-opacity="0.5" stroke-width="1.7"/>
      <rect x="71" y="332" width="28" height="266" rx="14" fill="url(#sheen)" opacity="0.86"/>
      <path d="M 56 586 L 156 586 L 156 592 C 156 612 147 622 127 622 L 85 622
               C 65 622 56 612 56 592 Z" fill="#4A1F05" opacity="0.30"/>

      <rect x="86" y="262" width="38" height="44" fill="url(#glass)"/>
      <rect x="86" y="262" width="10" height="44" fill="#FFF3DC" opacity="0.35"/>

      <rect x="79" y="250" width="52" height="15" rx="3" fill="#B08A4E"/>
      <rect x="79" y="250" width="52" height="5" rx="2" fill="#E5C98F" opacity="0.75"/>

      <rect x="73" y="158" width="64" height="96" rx="10" fill="url(#cap)"/>
      <path d="M 82 222 L 128 222 L 128 248 C 128 253 124 255 120 255
               L 90 255 C 86 255 82 253 82 248 Z" fill="url(#rubber)"/>
      <rect x="81" y="162" width="13" height="86" rx="6" fill="#FFFFFF" opacity="0.20"/>
      <rect x="73" y="158" width="64" height="96" rx="10" fill="url(#capGloss)"/>
      <ellipse cx="105" cy="160" rx="32" ry="6.2" fill="#1C1A18"/>
      <ellipse cx="105" cy="159" rx="22" ry="3.5" fill="#4A443E" opacity="0.7"/>

      <rect x="66" y="384" width="86" height="138" rx="2" fill="url(#label)"/>
      <rect x="66" y="384" width="86" height="138" rx="2" fill="none"
            stroke="#C8B89C" stroke-opacity="0.8" stroke-width="0.9"/>
      <text x="109" y="428" text-anchor="middle" textLength="68"
            lengthAdjust="spacing" font-family="DejaVu Serif, serif"
            font-size="21" fill="#231F1B">RAWAA</text>
      <line x1="86" y1="441" x2="132" y2="441" stroke="#9A7B45" stroke-width="1"/>
      <text x="109" y="468" text-anchor="middle"
            font-family="DejaVu Sans, sans-serif" font-size="10.5"
            letter-spacing="1.9" fill="#6B5B45">HAIR SERUM</text>
      <text x="109" y="500" text-anchor="middle"
            font-family="DejaVu Sans, sans-serif" font-size="11.5"
            letter-spacing="1.2" fill="#9A7B45">50 ML</text>
    </g>
  </g>

  <!-- توهّج علوي خفيف يوهم بضوء استوديو -->
  <ellipse cx="330" cy="120" rx="420" ry="220" fill="#FFFFFF" opacity="0.28" filter="url(#soft)"/>
</svg>
