<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>فحص الصور — رواء</title>
<link rel="stylesheet" href="css/check.css">
</head>
<body>
<h1>فحص الصور على جهازك</h1>
<p class="sub">افتح هذه الصفحة من نفس الجهاز الذي ترى فيه الصور معطوبة، ثم أرسل النتيجة.</p>

<div class="box">
  <div class="row"><span>المتصفح</span><span id="ua" class="report-meta">—</span></div>
  <div class="row"><span>دعم AVIF</span><span id="avif">—</span></div>
  <div class="row"><span>دعم WebP</span><span id="webp">—</span></div>
  <div class="row"><span>service worker نشِط</span><span id="sw">—</span></div>
  <div class="row"><span>صور سليمة</span><span id="okc">—</span></div>
  <div class="row"><span>صور معطوبة</span><span id="badc">—</span></div>
</div>

<div class="box">
  <strong class="report-small">الصور الحقيقية من مجلد الموقع:</strong>
  <div class="grid" id="grid"></div>
</div>

<button type="button" data-copy-report>انسخ التقرير</button>
<pre id="out">جارٍ الفحص…</pre>

<script src="js/check-inline.js" defer></script>
</body>
</html>
